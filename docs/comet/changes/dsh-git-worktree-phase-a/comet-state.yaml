  - id: A20
    source: specs/git-host/spec.md
    text: "| `POST /git/worktrees?sessionId=` | body { name, branch, createBranch?,
      startPoint?, path? };执行 `git worktree add`;成功返回新建行;路径冲突、分支冲突透传为
      `git/command-failed` 携带 stderr 摘要 |"
    result: failed
    reason:
      text: The route accepts body {name,branch,createBranch?,startPoint?,path?} but
        GitWorktreeService.addWorktree only passes the branch to git when
        createBranch===true; without it the branch is silently dropped and bare
        'git worktree add <path>' runs, which empirically creates a branch named
        after the path basename; the documented contract in shared.ts ('Branch
        to check out or create; defaults to name') is unimplementable as built,
        and branch-conflict refusals for the no-createBranch case are
        unreachable. Conflict passthrough as git/command-failed with stderr is
        tested only via a bad startPoint.
      truncated: false
