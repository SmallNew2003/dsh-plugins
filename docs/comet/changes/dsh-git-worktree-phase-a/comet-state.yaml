acceptance:
  - id: A1
    source: brief.md
    text: A1:会话 cwd 属于 git 仓库时,Session header 显示分支名徽章;cwd 非 git 仓库、cwd 不存在或 host 无
      git 命令时,徽章不渲染。
    result: passed
    reason:
      text: "GitBadge.tsx returns null when status is undefined or a failure;
        GitController.status returns the structured error body for any !ok
        response; host service maps non-repo to git/not-repo, missing cwd or
        unknown session to git/missing-dir, git absent to git/unavailable.
        Tests: git-badge.spec renders-branch and renders-nothing-for-non-repo;
        service.spec missing-dir tests."
      truncated: false
  - id: A2
    source: brief.md
    text: A2:会话 cwd 位于 worktree 时,徽章带 worktree 标记,tooltip 展示 worktree 路径与 main
      仓库路径;main checkout 无该标记。
    result: passed
    reason:
      text: GitBadge renders the worktree marker span only when status.isWorktree and
        uses badge.tooltip.worktree with branch, worktreePath, mainRepoPath;
        main checkout uses badge.tooltip.repo without paths. Test 'marks
        worktree sessions with the worktree marker'; service.spec asserts
        isWorktree=true with mainRepoPath for a linked-worktree session.
      truncated: false
  - id: A3
    source: brief.md
    text: A3:点击徽章打开面板,列出全部 worktree(路径、分支、main 徽标、脏状态计数,顺序同 `git worktree
      list`);Escape 与点击面板外部关闭并归还焦点。
    result: passed
    reason:
      text: Clicking the badge opens a role=dialog panel listing rows with path,
        branch, main badge and dirty count in git worktree list --porcelain
        order (service preserves git output order; service/routes tests assert
        order); Escape closes and refocuses the trigger (tested);
        outside-pointerdown dismissal implemented in GitBadge useEffect
        (implemented, not unit-tested).
      truncated: false
  - id: A4
    source: brief.md
    text: A4:面板每次打开时拉取 status 与 worktrees;面板内手动刷新按钮点击后重新拉取并呈现最新数据。
    result: failed
    reason:
      text: "Panel open and the refresh button call refreshPanel, which reads
        controller.status and is served by the client-side TTL cache
        (STATUS_TTL_MS=5000) - a call within the TTL window does not hit the
        network (controller.spec proves it). The manual refresh button therefore
        cannot guarantee fresh status; worktrees always re-fetch. Fix:
        refreshPanel must invalidate or bypass the status cache."
      truncated: false
  - id: A5
    source: brief.md
    text: A5:面板内新建 worktree:输入名称与分支名(默认同名),路径默认 `<repo 父目录>/<repo 名>-<名称>` 且可修改;成功后新
      worktree 出现在列表。
    result: failed
    reason:
      text: "Branch default-same-as-name is broken end-to-end: GitBadge.submitAdd
        sends only {name, branch?, path?} (never createBranch), and
        GitWorktreeService.addWorktree passes the branch to git only when
        createBranch===true, otherwise running bare 'git worktree add <path>'
        which empirically creates a branch named after the path basename, not
        the requested name; an explicitly entered branch is silently ignored.
        Path default preview and post-success listing work."
      truncated: false
  - id: A6
    source: brief.md
    text: A6:删除脏 worktree:删除按钮禁用并展示更改摘要;勾选"丢弃更改"后按钮可用,确认后该 worktree 被删除并从列表移除。
    result: passed
    reason:
      text: Dirty row delete button disabled while dirtyKnown && dirtyCount>0 &&
        !discardChecked, change summary shown with count + changedPaths up to
        10, checkbox enables the button, click deletes and the row is refetched
        away. Tested in git-badge.spec and service.spec.
      truncated: false
  - id: A7
    source: brief.md
    text: A7:main worktree 与当前会话 workspace 所在 worktree 不提供删除入口;host 对这两类删除请求返回
      `git/protected`。
    result: passed
    reason:
      text: "Host refuses both categories with git/protected in the service layer
        (tested: main worktree refused; session workspace worktree refused; from
        a worktree session both its own row and main refused). UI renders a
        disabled delete button with explanatory tooltip instead of no button -
        functionally no deletion entry; letter deviation noted in risks."
      truncated: false
  - id: A8
    source: brief.md
    text: A8:模型可调用
      `git_worktree_list`/`git_worktree_add`/`git_worktree_remove`;调用与结果记录在会话日志;remove
      对脏 worktree 且未显式 `discardChanges` 时返回结构化错误且不执行删除。
    result: passed
    reason:
      text: Three tools registered over the real ToolRuntime (registration test);
        dirty remove without discardChanges returns
        {ok:false,error:{code:'git/dirty',detail}} and the service test proves
