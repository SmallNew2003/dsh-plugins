      truncated: false
  - id: A9
    source: brief.md
    text: A9:全部用户可见文案来自双语字典;host 错误以结构化错误码传递,面板将已知码映射为具体文案,未知码显示通用错误文案。
    result: passed
    reason:
      text: locales.ts defines zh (key source of truth) and en typed
