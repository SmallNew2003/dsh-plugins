      2. packages/tool-git-worktree, inject ['tools','gitWorktree']: three defineTool registrations git_worktree_list/add/remove (English descriptions, parameter DSL, output.schema + render). No session agent -> structured git/missing-dir outcome; GitError folded into {ok:false,error:{code,message,detail?}} via duck-typed code check (git/ prefix); renders UI-equivalent text lines. Type-only imports of the host package (no second class copy).
