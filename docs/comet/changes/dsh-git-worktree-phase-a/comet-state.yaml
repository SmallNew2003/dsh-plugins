      提供);切换会话或关闭后重开面板时重新拉取,呈现当前会话仓库的最新分支。
    result: failed
    reason:
      text: "Two deviations: the client TTL is a hardcoded local constant
        (controller.ts STATUS_TTL_MS=5000), not TTL provided by host Config (the
