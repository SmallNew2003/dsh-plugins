    result: passed
    reason:
      text: git/protected for main and session-workspace worktrees, thrown only inside
        the service so routes and tools cannot bypass; UI renders no entry for
        protected rows.
      truncated: false
  - id: A29
    source: specs/git-host/spec.md
    text: "`discardChanges=true` 但实际无更改 → 照常删除,不视为错误。"
    result: passed
    reason:
      text: With discardChanges=true the dirty guard is skipped and removal proceeds
