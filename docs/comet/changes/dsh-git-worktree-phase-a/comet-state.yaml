        existing-branch and start-point tests.
      truncated: false
  - id: A25
    source: specs/git-host/spec.md
    text: 删除:`git worktree remove <path>`;仅当请求显式 `discardChanges=true` 时追加 `--force`。
    result: passed
    reason:
      text: removeWorktree builds worktree remove with --force only when
