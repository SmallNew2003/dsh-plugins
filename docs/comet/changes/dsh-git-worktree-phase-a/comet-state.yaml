      truncated: false
  - id: A30
    source: specs/git-host/spec.md
    text: 结构化错误码:`git/unavailable`、`git/not-repo`、`git/missing-dir`、`git/dirty`、`git/protected`、`git/command-failed`(携带
      stderr 摘要与退出码)。错误体为 JSON:{ code, message, detail? }。
    result: passed
    reason:
      text: errors.ts defines the six-code vocabulary; sendError emits JSON
