acceptance:
  - id: A1
    source: brief.md
    text: A1:会话 cwd 属于 git 仓库时,Session header 显示分支名徽章;cwd 非 git 仓库、cwd 不存在或 host 无
      git 命令时,徽章不渲染。
    result: passed
    reason:
      text: GitBadge.tsx returns null while status is undefined or a structured
        failure (non-repo/missing-dir/unavailable all arrive as error bodies);
        otherwise the branch name renders in the header button. Non-git cwd,
        missing cwd, and git-less host all degrade to no badge.
      truncated: false
  - id: A2
    source: brief.md
    text: A2:会话 cwd 位于 worktree 时,徽章带 worktree 标记,tooltip 展示 worktree 路径与 main
      仓库路径;main checkout 无该标记。
    result: passed
    reason:
      text: The worktree marker renders only when known.isWorktree; tooltip uses
        badge.tooltip.worktree with worktreePath and mainRepoPath; main checkout
        uses badge.tooltip.repo with no marker.
      truncated: false
  - id: A3
    source: brief.md
    text: A3:点击徽章打开面板,列出全部 worktree(路径、分支、main 徽标、脏状态计数,顺序同 `git worktree
      list`);Escape 与点击面板外部关闭并归还焦点。
    result: passed
    reason:
      text: Badge onClick toggles the dialog panel listing
        path/branch/main-badge/dirty per row in git porcelain order; Escape
        closes and refocuses triggerRef; pointerdown outside rootRef closes.
      truncated: false
  - id: A4
    source: brief.md
    text: A4:面板每次打开时拉取 status 与 worktrees;面板内手动刷新按钮点击后重新拉取并呈现最新数据。
    result: passed
    reason:
      text: Panel-open effect calls refreshPanel which fetches
        controller.status(sessionId,{force:true}) plus worktrees; refresh button
        calls the same refreshPanel; controller skips the cached read under
        force. Covered by controller.spec 'force bypasses the cache'.
      truncated: false
  - id: A5
    source: brief.md
    text: A5:面板内新建 worktree:输入名称与分支名(默认同名),路径默认 `<repo 父目录>/<repo 名>-<名称>` 且可修改;成功后新
      worktree 出现在列表。
    result: passed
    reason:
      text: Form has name, branch (placeholder same-as-name), editable path defaulting
        to repo-parent/repo-name-name host-identical to service.addWorktree;
        submitAdd sends createBranch:true with branch defaulting to name;
        success refetches the listing.
      truncated: false
  - id: A6
    source: brief.md
    text: A6:删除脏 worktree:删除按钮禁用并展示更改摘要;勾选"丢弃更改"后按钮可用,确认后该 worktree 被删除并从列表移除。
    result: passed
    reason:
      text: Delete disabled while dirtyKnown and dirtyCount>0 and not discardChecked;
        summary shows count plus up to 10 changed paths; discard checkbox
        enables; submitRemove executes and refetches.
      truncated: false
  - id: A7
    source: brief.md
    text: A7:main worktree 与当前会话 workspace 所在 worktree 不提供删除入口;host 对这两类删除请求返回
      `git/protected`。
    result: passed
    reason:
      text: protectedRow (isMain or path equals known.worktreePath) renders NO delete
        button; service.removeWorktree throws git/protected for both main and
        session-workspace worktrees - double insurance intact.
      truncated: false
  - id: A8
    source: brief.md
    text: A8:模型可调用
      `git_worktree_list`/`git_worktree_add`/`git_worktree_remove`;调用与结果记录在会话日志;remove
      对脏 worktree 且未显式 `discardChanges` 时返回结构化错误且不执行删除。
    result: passed
    reason:
      text: tool-git-worktree registers git_worktree_list/add/remove over the injected
        gitWorktree service; dirty-without-discard refuses git/dirty before any
        deletion; structured outcomes are logged by the framework tool
        execution.
      truncated: false
  - id: A9
    source: brief.md
    text: A9:全部用户可见文案来自双语字典;host 错误以结构化错误码传递,面板将已知码映射为具体文案,未知码显示通用错误文案。
    result: passed
    reason:
      text: All user-visible strings from zh/en key-identical locale dictionaries via
        t; errorMessage maps the six known codes and falls back to error.generic
        carrying message and detail.
      truncated: false
  - id: A10
    source: brief.md
    text: A10:status 读取带短 TTL 缓存(TTL 由 host Config
      提供);切换会话或关闭后重开面板时重新拉取,呈现当前会话仓库的最新分支。
    result: passed
    reason:
      text: Host status payload carries statusCacheTtlMs equal to the Config value;
        the client cache window uses the payload TTL with fallback only when
        absent; panel reopen is forced. Covered by controller.spec 'uses the
        host-provided statusCacheTtlMs'.
      truncated: false
  - id: A11
    source: specs/git-host/spec.md
    text: 归档后的完整行为:插件包 `dsh-git-host` 在 host 进程内提供 git 查询与 worktree 管理服务,经 webServer
      路由暴露给浏览器,经服务面暴露给模型工具。
    result: passed
    reason:
      text: packages/git-host provides GitWorktreeService and four webServer routes;
        inject ['webServer','connection','subprocess','sessions'] wires browser
        routes and the model-facing service from one package.
      truncated: false
  - id: A12
    source: specs/git-host/spec.md
    text: 一个 host 插件包,内部两层:git 域服务(命令执行、解析、保护规则)与路由 Consumer。UI 包与工具包是同一服务的另外两个
      Consumer;本包不依赖任何 Desktop 专用 service,普通 `dsh web` 组合同样可用。
    result: passed
    reason:
      text: "Two layers: git domain service plus route Consumer; UI and tools consume
        the same service; no Desktop-specific services injected, so plain dsh
        web composes."
      truncated: false
  - id: A13
    source: specs/git-host/spec.md
    text: 按 `sessionId` 解析会话工作目录(cwd,来自 host 侧 session 摘要;具体接口在 Build 第一轮核实并记录)。
    result: passed
    reason:
      text: service.sessionCwd resolves header.cwd from ctx.sessions with a
        sessionPersistence.stat fallback for cold sessions, caches per
        sessionId, canonicalizes via realpath.
      truncated: false
  - id: A14
    source: specs/git-host/spec.md
    text: 由 cwd 向上解析仓库根:`git -C <cwd> rev-parse --show-toplevel` 取当前 worktree
      根,`rev-parse --git-common-dir` 取 main 仓库标识;一次解析、进程内缓存,以路径失效。
    result: passed
    reason:
      text: resolveRepo runs one rev-parse --show-toplevel --git-common-dir round
        trip; result cached in this.repos per cwd, invalidated on rejection.
      truncated: false
  - id: A15
    source: specs/git-host/spec.md
    text: cwd 不存在返回 `git/missing-dir`;目录不是 git 仓库返回 `git/not-repo`;git 命令不在 PATH 返回
      `git/unavailable`。
    result: passed
    reason:
      text: Nonexistent cwd returns git/missing-dir; rev-parse failure returns
        git/not-repo; resolveGitPath null returns git/unavailable.
      truncated: false
  - id: A16
    source: specs/git-host/spec.md
    text: 全部路由要求与 open-in-app 同级的浏览器鉴权与 origin 校验,并校验 sessionId 归属。
    result: passed
    reason:
      text: Every route handler calls connection.requestRejection first - the
        open-in-app trust fence; unknown or unresolvable sessionIds refused via
        git/missing-dir within the single-user host.
      truncated: false
  - id: A17
    source: specs/git-host/spec.md
    text: "| 路由 | 行为 |"
    result: passed
    reason:
      text: The spec route table exists verbatim in the git-host spec and all four
        rows are implemented.
      truncated: false
  - id: A18
    source: specs/git-host/spec.md
    text: "| `GET /git/status?sessionId=` | 返回:{ branch(分离 HEAD 时为 `HEAD` + 短
