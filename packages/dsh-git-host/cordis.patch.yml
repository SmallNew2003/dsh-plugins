# dsh-git-host bundle layer: the git domain service plus its four webServer
# routes. Config is fully required (no hardcoded tunables), so the bundle
# layer ships sensible defaults; a user patch may override by entry id.
- insert:
    - id: git-host
      name: './lib/index.js'
      config:
        commandTimeoutMs: 30000
        dirtyCheckLimit: 8
        statusCacheTtlMs: 5000
